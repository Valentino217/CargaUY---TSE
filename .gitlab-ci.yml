stages:
  - build
  - test
  - quality
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

# Etapa 1: Compilación de todos los módulos Maven
build-job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean compile

# Etapa 2: tests unitarios + reporte JaCoCo + jacoco:check (umbral en pom raíz: jacoco.minimum.coverage)
unit-tests-job:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
    paths:
      - "**/target/site/jacoco/"

# Etapa 3: Análisis estático de código y Quality Gate en SonarQube (solo si SONAR_TOKEN está definido)
sonarqube-job:
  stage: quality
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarqube.fing.edu.uy}
        -Dsonar.token=${SONAR_TOKEN}
        -Dsonar.projectKey=uy.edu.fing.grupo07:CargaUY
        '-Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml'
  rules:
    - if: '$SONAR_TOKEN && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop")'
      when: on_success
    - when: never

# Etapa 4: Empaquetado final del EAR para entrega / despliegue
package-job:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    name: "CargaUY-EAR-$CI_COMMIT_SHORT_SHA"
    paths:
      - ear/target/CargaUY.ear
      - gub-callback-root/target/gub-callback-root.war
    expire_in: 30 days
