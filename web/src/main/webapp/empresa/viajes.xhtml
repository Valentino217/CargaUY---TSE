<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">Guías de Viaje</ui:define>

    <ui:define name="content">

        <div class="cuy-page-header">
            <div>
                <h1 class="cuy-page-title">
                    <i class="pi pi-map" style="color: var(--cuy-accent);" />
                    Gestión de Guías de Viaje
                </h1>
            </div>
            <h:form id="headerViajesActions" style="margin: 0;">
                <p:commandButton value="Emitir Nueva Guía de Viaje"
                                 icon="pi pi-plus-circle"
                                 actionListener="#{GuiaDeViajeBean.nuevo}"
                                 update=":dialogGuiaForm"
                                 oncomplete="PF('wvDialogGuia').show()"
                                 styleClass="ui-button-primary" />
            </h:form>
        </div>

        <!-- Tabla de Guías de Viaje -->
        <div class="cuy-card">
            <h:form id="formTablaGuias">
                <p:dataTable id="tablaGuias"
                             widgetVar="wvTablaGuias"
                             value="#{GuiaDeViajeBean.guiaDeViajes}"
                             var="g"
                             paginator="true"
                             rows="10"
                             paginatorPosition="bottom"
                             rowsPerPageTemplate="10,20,50"
                             emptyMessage="No se encontraron Guías de Viaje registradas para su empresa."
                             stripedRows="true"
                             size="small"
                             reflow="true">

                    <p:column headerText="Guía #" sortBy="#{g.id}" filterBy="#{g.id}" filterMatchMode="exact" style="width: 90px; text-align: center;">
                        <span class="cuy-mono">##{g.id}</span>
                    </p:column>

                    <p:column headerText="Fecha" sortBy="#{g.fecha}" style="width: 120px;">
                        <h:outputText value="#{g.fecha}" />
                    </p:column>

                    <p:column headerText="Origen Destino" sortBy="#{g.origen}" filterBy="#{g.origen}" filterMatchMode="contains">
                        <strong>#{g.origen}</strong> &#8594; <strong>#{g.destino}</strong>
                        <small style="display: block; color: var(--cuy-muted);">Rubro: #{g.rubroCliente} &#8226; Carga: <h:outputText value="#{g.volumenCarga}"><f:convertNumber pattern="#,##0" /></h:outputText> kg</small>
                    </p:column>

                    <p:column headerText="Vehículo Asignado" sortBy="#{g.vehiculo.matricula}" filterBy="#{g.vehiculo.matricula}" filterMatchMode="contains" style="width: 165px;">
                        <ui:fragment rendered="#{not empty g.vehiculo}">
                            <span class="cuy-mono"><i class="pi pi-car" /> #{g.vehiculo.matricula}</span>
                            <small style="display: block; color: var(--cuy-muted); margin-top: 2px;">#{g.vehiculo.marca} #{g.vehiculo.modelo}</small>
                        </ui:fragment>
                    </p:column>

                    <p:column headerText="Chofer Asignado" sortBy="#{g.chofer.nombre}" filterBy="#{g.chofer.nombre}" filterMatchMode="contains">
                        <ui:fragment rendered="#{not empty g.chofer}">
                            <strong>#{g.chofer.nombre}</strong>
                            <small style="display: block; color: var(--cuy-muted);">CI: #{g.chofer.ci}</small>
                        </ui:fragment>
                    </p:column>

                    <p:column headerText="Estado" sortBy="#{g.estado}" filterBy="#{g.estado}" filterMatchMode="exact" style="width: 150px; text-align: center;">
                        <p:tag value="#{g.estado}"
                               severity="#{g.estado eq 'FINALIZADO' ? 'success' : (g.estado eq 'EN_CURSO' ? 'info' : 'warning')}"
                               rounded="true" />
                    </p:column>

                    <p:column headerText="Acciones" style="width: 180px; text-align: center;">
                        <h:panelGroup rendered="#{g.estado.name() eq 'SIN_INICIAR'}">
                            <p:commandButton icon="pi pi-pencil"
                                             title="Editar Guía"
                                             actionListener="#{GuiaDeViajeBean.editar(g)}"
                                             update=":dialogGuiaForm"
                                             oncomplete="PF('wvDialogGuia').show()"
                                             styleClass="ui-button-outlined ui-button-info ui-button-sm"
                                             style="margin-right: 0.35rem;" />

                            <p:commandButton icon="pi pi-trash"
                                             title="Cancelar / Eliminar Guía"
                                             actionListener="#{GuiaDeViajeBean.eliminar(g)}"
                                             update="tablaGuias :growl"
                                             styleClass="ui-button-outlined ui-button-danger ui-button-sm"
                                             style="margin-right: 0.35rem;">
                                <p:confirm header="Confirmar Eliminación de Guía"
                                           message="¿Está seguro de eliminar la Guía de Viaje ##{g.id} (#{g.origen} &#8594; #{g.destino})?"
                                           icon="pi pi-exclamation-triangle" />
                            </p:commandButton>

                            <p:commandButton icon="pi pi-play"
                                             title="Admin: Iniciar Viaje (Pasar a EN_CURSO)"
                                             rendered="#{authBean.esAdministrador()}"
                                             actionListener="#{GuiaDeViajeBean.avanzarEstado(g)}"
                                             update="tablaGuias :growl"
                                             styleClass="ui-button-success ui-button-sm">
                                <p:confirm header="Iniciar Viaje"
                                           message="¿Confirma el inicio operativo del viaje de la guía ##{g.id}? El estado pasará a EN_CURSO."
                                           icon="pi pi-play" />
                            </p:commandButton>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{g.estado.name() eq 'EN_CURSO'}">
                            <h:panelGroup rendered="#{authBean.esAdministrador()}">
                                <p:commandButton icon="pi pi-check-circle"
                                                 value="Finalizar"
                                                 title="Admin: Finalizar Viaje (Pasar a FINALIZADO)"
                                                 actionListener="#{GuiaDeViajeBean.avanzarEstado(g)}"
                                                 update="tablaGuias :growl"
                                                 styleClass="ui-button-outlined ui-button-success ui-button-sm">
                                    <p:confirm header="Finalizar Viaje"
                                               message="¿Confirma la finalización definitiva de la guía ##{g.id}? El estado pasará a FINALIZADO."
                                               icon="pi pi-check-circle" />
                                </p:commandButton>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{not authBean.esAdministrador()}">
                                <i class="pi pi-lock" title="Viaje en curso" style="font-size: 1.1rem; color: #64748b;" />
                            </h:panelGroup>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{g.estado.name() eq 'FINALIZADO'}">
                            <i class="pi pi-lock" title="Viaje finalizado" style="font-size: 1.1rem; color: #64748b;" />
                        </h:panelGroup>
                    </p:column>

                </p:dataTable>
            </h:form>
        </div>

        <!-- Diálogo Modal para Emitir / Editar Guía de Viaje y Asignar Vehículo/Chofer -->
        <p:dialog id="dialogGuia"
                  widgetVar="wvDialogGuia"
                  header="#{GuiaDeViajeBean.editando ? 'Modificar Guía de Viaje' : 'Emitir Nueva Guía de Viaje'}"
                  modal="true"
                  responsive="true"
                  width="680"
                  closeOnEscape="true">

            <h:form id="dialogGuiaForm" styleClass="ui-fluid">
                <p:fieldset legend="1. Empresa y Asignación de Recursos" style="margin-bottom: 1rem;">
                    <div class="cuy-form-grid-3">
                        <div class="cuy-field">
                            <p:outputLabel for="empSelect" value="Empresa" />
                            <p:selectOneMenu id="empSelect" value="#{GuiaDeViajeBean.empresaId}" required="true">
                                <f:selectItems value="#{GuiaDeViajeBean.empresas}"
                                               var="e"
                                               itemLabel="#{e.razonSocial}"
                                               itemValue="#{e.nroEmpresa}" />
                                <p:ajax listener="#{GuiaDeViajeBean.seleccionarEmpresa}" update="vehSelect chofSelect" />
                            </p:selectOneMenu>
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="vehSelect" value="Vehículo Habilitado" />
                            <p:selectOneMenu id="vehSelect" value="#{GuiaDeViajeBean.matriculaVehiculo}" required="true"
                                             requiredMessage="Debe seleccionar un vehículo habilitado.">
                                <f:selectItem itemLabel="#{empty GuiaDeViajeBean.vehiculos ? 'Sin vehículos habilitados' : '-- Seleccionar Vehículo --'}"
                                              itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{GuiaDeViajeBean.vehiculos}"
                                               var="v"
                                               itemLabel="#{v.matricula} (#{v.marca} #{v.modelo})"
                                               itemValue="#{v.matricula}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="chofSelect" value="Chofer Asignado" />
                            <p:selectOneMenu id="chofSelect" value="#{GuiaDeViajeBean.choferId}" required="true">
                                <f:selectItems value="#{GuiaDeViajeBean.choferes}"
                                               var="c"
                                               itemLabel="#{c.nombre} (CI #{c.ci})"
                                               itemValue="#{c.id}" />
                            </p:selectOneMenu>
                        </div>
                    </div>
                </p:fieldset>

                <p:fieldset legend="2. Detalles de Ruta y Carga Declarada" style="margin-bottom: 1.25rem;">
                    <div class="cuy-form-grid-2">
                        <div class="cuy-field">
                            <p:outputLabel for="origenSelect" value="Localidad de Origen" />
                            <p:selectOneMenu id="origenSelect" value="#{GuiaDeViajeBean.guia.origen}" filter="true" filterMatchMode="contains" required="true">
                                <f:selectItems value="#{GuiaDeViajeBean.localidadesUruguay}" var="locO" itemLabel="#{locO}" itemValue="#{locO}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="destinoSelect" value="Localidad de Destino" />
                            <p:selectOneMenu id="destinoSelect" value="#{GuiaDeViajeBean.guia.destino}" filter="true" filterMatchMode="contains" required="true">
                                <f:selectItems value="#{GuiaDeViajeBean.localidadesUruguay}" var="locD" itemLabel="#{locD}" itemValue="#{locD}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="rubroSelect" value="Rubro del Cliente" />
                            <p:selectOneMenu id="rubroSelect" value="#{GuiaDeViajeBean.guia.rubroCliente}" editable="true" required="true">
                                <f:selectItems value="#{GuiaDeViajeBean.rubrosDisponibles}" var="rub" itemLabel="#{rub}" itemValue="#{rub}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="volInput" value="Volumen / Peso Declarado (kg)" />
                            <p:inputNumber id="volInput" value="#{GuiaDeViajeBean.guia.volumenCarga}" decimalPlaces="0"
                                           thousandSeparator="." decimalSeparator="," suffix=" kg" minValue="1" required="true" />
                        </div>

                        <div class="cuy-field">
                            <p:outputLabel for="fechaInput" value="Fecha Programada" />
                            <p:datePicker id="fechaInput" value="#{GuiaDeViajeBean.guia.fecha}" pattern="yyyy-MM-dd" showIcon="true" required="true" />
                        </div>
                    </div>
                </p:fieldset>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     onclick="PF('wvDialogGuia').hide()"
                                     styleClass="ui-button-secondary ui-button-outlined"
                                     style="width: auto;" />
                    <p:commandButton value="Emitir y Guardar Guía"
                                     icon="pi pi-check"
                                     actionListener="#{GuiaDeViajeBean.guardar}"
                                     process="@form"
                                     update=":formTablaGuias:tablaGuias :growl"
                                     oncomplete="if (!args.validationFailed) PF('wvDialogGuia').hide()"
                                     styleClass="ui-button-primary"
                                     style="width: auto;" />
                </div>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
