<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<h:head>
    <title>CargaUY - Guías de Viaje</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header-bar h1 {
            margin: 0;
            color: #1e3a8a;
            font-size: 1.8rem;
        }
        .header-bar small {
            color: #64748b;
        }
        .nav-links a {
            margin-left: 16px;
            text-decoration: none;
            color: #1e3a8a;
            font-weight: 500;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        .mb-4 {
            margin-bottom: 20px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-field label {
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }
        .form-field input[type="text"],
        .form-field select {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: #1e293b;
        }
        .form-field input[type="text"]:focus,
        .form-field select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-SIN_INICIAR { background-color: #f1f5f9; color: #475569; }
        .badge-EN_CURSO { background-color: #e0f2fe; color: #0369a1; }
        .badge-FINALIZADO { background-color: #dcfce7; color: #166534; }
    </style>
</h:head>

<h:body>
    <div class="container">
        <div class="header-bar">
            <div>
                <h1>Gestión de Guías de Viaje</h1>
                <small>Emisión, seguimiento y control de transporte de carga</small>
            </div>
            <div class="nav-links">
                <a href="index.xhtml">Inicio</a>
                <a href="VehiculoJSF.xhtml">Vehículos</a>
                <a href="infracciones.xhtml">Infracciones</a>
                <a href="dashboard.xhtml">Dashboard</a>
                <a href="detalleViaje.xhtml">Tracking</a>
            </div>
        </div>

        <h:form id="form">
            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <p:panel header="#{GuiaDeViajeBean.editando ? 'Editar Guía de Viaje' : 'Nueva Guía de Viaje'}" styleClass="mb-4">
                <div class="form-grid">
                    <div class="form-field">
                        <h:outputLabel for="fecha" value="Fecha: *"/>
                        <p:datePicker id="fecha" 
                                      value="#{GuiaDeViajeBean.guia.fecha}"
                                      pattern="dd/MM/yyyy"
                                      required="true"
                                      requiredMessage="La fecha es obligatoria."/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="origen" value="Origen:"/>
                        <h:inputText id="origen" value="#{GuiaDeViajeBean.guia.origen}"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="destino" value="Destino:"/>
                        <h:inputText id="destino" value="#{GuiaDeViajeBean.guia.destino}"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="rubroCliente" value="Rubro Cliente:"/>
                        <h:inputText id="rubroCliente" value="#{GuiaDeViajeBean.guia.rubroCliente}"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="volumenCarga" value="Volumen de Carga (m³):"/>
                        <h:inputText id="volumenCarga" value="#{GuiaDeViajeBean.guia.volumenCarga}"/>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="empresa" value="Empresa: *"/>
                        <h:selectOneMenu id="empresa"
                                         value="#{GuiaDeViajeBean.empresaId}"
                                         required="true"
                                         requiredMessage="Debe seleccionar una empresa.">
                            <f:selectItem itemLabel="Seleccione una empresa" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{GuiaDeViajeBean.empresas}"
                                           var="empresa"
                                           itemValue="#{empresa.nroEmpresa}"
                                           itemLabel="#{empresa.razonSocial}"/>
                            <f:ajax listener="#{GuiaDeViajeBean.seleccionarEmpresa}" render=":form:vehiculo :form:chofer" />
                        </h:selectOneMenu>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="vehiculo" value="Vehículo: *"/>
                        <h:selectOneMenu id="vehiculo"
                                         value="#{GuiaDeViajeBean.matriculaVehiculo}"
                                         required="true"
                                         requiredMessage="Debe seleccionar un vehículo.">
                            <f:selectItem itemLabel="Seleccione un vehículo" itemValue="" noSelectionOption="true" />
                            <f:selectItems value="#{GuiaDeViajeBean.vehiculos}"
                                           var="v"
                                           itemValue="#{v.matricula}"
                                           itemLabel="#{v.matricula}" />
                        </h:selectOneMenu>
                    </div>

                    <div class="form-field">
                        <h:outputLabel for="chofer" value="Chofer: *"/>
                        <h:selectOneMenu id="chofer"
                                         value="#{GuiaDeViajeBean.choferId}"
                                         required="true"
                                         requiredMessage="Debe seleccionar un chofer.">
                            <f:selectItem itemLabel="Seleccione un chofer" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItems value="#{GuiaDeViajeBean.choferes}"
                                           var="c"
                                           itemValue="#{c.id}"
                                           itemLabel="#{c.nombre}" />
                        </h:selectOneMenu>
                    </div>
                </div>

                <div style="margin-top: 16px;">
                    <p:commandButton value="#{GuiaDeViajeBean.editando ? 'Actualizar' : 'Guardar'}"
                                     action="#{GuiaDeViajeBean.guardar}"
                                     process="@form"
                                     update="@form"
                                     style="margin-right: 10px;"/>

                    <p:commandButton value="Cancelar"
                                     action="#{GuiaDeViajeBean.nuevo}"
                                     process="@this"
                                     update="@form"
                                     rendered="#{GuiaDeViajeBean.editando}"
                                     styleClass="ui-button-secondary"/>
                </div>
            </p:panel>

            <p:panel header="Guías de Viaje Registradas">
                <p:dataTable id="tablaGuias"
                             value="#{GuiaDeViajeBean.guiaDeViajes}"
                             var="g"
                             emptyMessage="No hay guías registradas"
                             responsiveLayout="scroll">

                    <p:column headerText="Fecha" style="width: 100px;">
                        <h:outputText value="#{g.fecha}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Origen">
                        <h:outputText value="#{g.origen}"/>
                    </p:column>

                    <p:column headerText="Destino">
                        <h:outputText value="#{g.destino}"/>
                    </p:column>

                    <p:column headerText="Rubro Cliente">
                        <h:outputText value="#{g.rubroCliente}"/>
                    </p:column>

                    <p:column headerText="Volumen (m³)" style="width: 110px; text-align: right;">
                        <h:outputText value="#{g.volumenCarga}"/>
                    </p:column>

                    <p:column headerText="Empresa">
                        <h:outputText value="#{g.empresa.razonSocial}"/>
                    </p:column>

                    <p:column headerText="Vehículo" style="width: 110px;">
                        <h:outputText value="#{g.vehiculo != null ? g.vehiculo.matricula : 'Sin asignar'}"/>
                    </p:column>

                    <p:column headerText="Chofer">
                        <h:outputText value="#{g.chofer != null ? g.chofer.nombre : 'Sin asignar'}"/>
                    </p:column>

                    <p:column headerText="Estado" style="width: 120px; text-align: center;">
                        <span class="badge badge-#{g.estado}">#{g.estado}</span>
                    </p:column>

                    <p:column headerText="Acciones" style="width: 220px; text-align: center;">
                        <div style="display: flex; gap: 8px; justify-content: center;">
                            <p:button icon="pi pi-compass"
                                      title="Ver Tracking y Eventos"
                                      href="detalleViaje.xhtml?guiaId=#{g.id}"
                                      styleClass="ui-button-info"/>

                            <p:commandButton value="Modificar"
                                             action="#{GuiaDeViajeBean.editar(g)}"
                                             process="@this"
                                             update="@form"
                                             icon="pi pi-pencil"/>

                            <p:commandButton value="Eliminar"
                                             action="#{GuiaDeViajeBean.eliminar(g)}"
                                             process="@this"
                                             update="@form"
                                             onclick="return confirm('¿Eliminar esta guía?')"
                                             icon="pi pi-trash"
                                             styleClass="ui-button-danger"/>
                        </div>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </div>
</h:body>
</html>
