<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">Nodos</ui:define>

    <ui:define name="content">
        <div class="cuy-page-header">
            <div>
                <h1 class="cuy-page-title">
                    <i class="pi pi-server" style="color: #1d4ed8;" />
                    Monitoreo de Nodos y Servicios
                </h1>
                <p class="cuy-page-subtitle">
                    Estado operativo en tiempo real de balanzas, PDI, LDAP, Identity Provider y mensajería asíncrona.
                </p>
            </div>
            <div>
                <h:form id="sondarNodosForm" style="margin: 0;">
                    <p:commandButton value="Sondear Nodos"
                                     icon="pi pi-sync"
                                     actionListener="#{adminNodosBean.sondarNodos}"
                                     update=":nodosForm :growl"
                                     styleClass="ui-button-primary" />
                </h:form>
            </div>
        </div>

        <!-- Tabla de Nodos -->
        <h:form id="nodosForm">
            <div class="cuy-card">
                <p:dataTable id="tablaNodos"
                             var="nodo"
                             value="#{adminNodosBean.nodos}"
                             stripedRows="true"
                             size="small">

                    <p:column headerText="Código" style="width: 135px;">
                        <span class="cuy-mono">#{nodo.codigo()}</span>
                    </p:column>

                    <p:column headerText="Nodo / Subsistema">
                        <strong style="color: #0f2942;">#{nodo.nombre()}</strong>
                    </p:column>

                    <p:column headerText="Protocolo" style="width: 140px;">
                        <p:tag value="#{nodo.tipo()}" severity="info" rounded="true" />
                    </p:column>

                    <p:column headerText="Endpoint / Destino">
                        <span class="cuy-mono" style="font-size: 0.78rem;">#{nodo.endpoint()}</span>
                    </p:column>

                    <p:column headerText="Estado" style="width: 140px; text-align: center;">
                        <p:tag value="#{nodo.online() ? 'ONLINE' : 'OFFLINE'}"
                               severity="#{nodo.online() ? 'success' : 'danger'}"
                               icon="#{nodo.online() ? 'pi pi-check-circle' : 'pi pi-times-circle'}"
                               rounded="true" />
                    </p:column>
                </p:dataTable>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
