version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_p1:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargauy -d cargauy"]
      interval: 5s
      timeout: 5s
      retries: 5

  ldap:
    build: ./docker/ldap
    restart: unless-stopped
    environment:
      LDAP_ROOT_PASSWORD: ${LDAP_ROOT_PASSWORD:-vQUP53jJO6NyQD9V8hXK7oFQ-NmPjD9VS1NLoC-INkE}
      LDAP_APP_PASSWORD: ${LDAP_APP_PASSWORD:-admin123}
      LDAP_APP_UID: ${LDAP_APP_UID:-martin.admin}
    ports:
      - "127.0.0.1:1389:1389"
    volumes:
      - ldap_p1:/data

  gub:

    image: quay.io/keycloak/keycloak:26.4.7
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    security_opt:
      - seccomp:unconfined
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-gestor-idp}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-nr4i7WZyse1sY3oQkYKI6Nm4z5RjOn7tOJxDjT5EUm8}
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./.local-p1/gub-realm.json:/opt/keycloak/data/import/cargauy-test-realm.json:ro
      - keycloak_p1:/opt/keycloak/data

  mongodb:
    image: mongo:7
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_p1:/data/db

  mock-pdi:
    build: ./docker/mock-pdi
    restart: unless-stopped
    environment:
      PDI_PUBLIC_ENDPOINT: http://mock-pdi:8080/pdi/ws
      PDI_DELAY_SECONDS: "0"
    ports:
      - "8081:8080"

  mock-balanza:
    build: ./docker/mock-balanza
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      PORT: "8080"
      BALANZA_DB_PATH: /data/balanzas.db
    ports:
      - "8082:8080"
    volumes:
      - balanza_p1:/data

  wildfly:
    env_file:
      - .env
      - ./.local-p1/gub-real.env
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    depends_on:
      - postgres
      - mongodb
      - ldap



    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cargauy
      DB_USER: cargauy
      DB_PASSWORD: cargauy123
      P1_ENTORNO_LOCAL: "true"
      P1_BOOTSTRAP: "true"
      BOOTSTRAP_ADMIN_UID: "martin.admin"
      BOOTSTRAP_ADMIN_CI: "90000001"
      BOOTSTRAP_ADMIN_NOMBRE: "Administrador de pruebas"
      BOOTSTRAP_ADMIN_MAIL: "admin@example.invalid"
      BOOTSTRAP_ADMIN_NACIMIENTO: "1990-01-01"
      PDI_ENDPOINT: http://mock-pdi:8080/pdi/ws
      BALANZA_ENDPOINT: http://mock-balanza:8080
      MONGO_URI: mongodb://mongodb:27017
      LDAP_URL: ldap://ldap:1389
      GUB_PROVEEDOR: iduruguay
      GUB_ISSUER: https://auth-testing.iduruguay.gub.uy/oidc/v1
      GUB_JWKS: https://auth-testing.iduruguay.gub.uy/oidc/v2/jwks
      GUB_CLIENT_ID: "890192"
      GUB_REDIRECT: ${GUB_REDIRECT:-https://carga-uy.web.elasticloud.uy/CargaUY-web/gub/callback}
      GUB_PKCE: "false"
      GUB_MOBILE_ENABLED: "true"
      GUB_MOBILE_REDIRECT: http://localhost:8080/CargaUY-web/gub/callback
      GUB_DOCUMENT_PAIS: Uruguay
      GUB_DOCUMENT_TIPO: DNI
      GUB_DOCUMENT_ASUMIR_LOCAL: "true"
    ports:
      - "8080:8080"
      - "127.0.0.1:9990:9990"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/jelastic/keys:/etc/nginx/certs:ro
    depends_on:
      - wildfly

volumes:
  pgdata_p1:
  ldap_p1:
  keycloak_p1:
  mongo_p1:
  balanza_p1:
