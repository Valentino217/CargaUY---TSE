services:
  postgres:
    image: postgres:16-alpine
    container_name: cargauy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargauy -d cargauy"]
      interval: 5s
      timeout: 5s
      retries: 5

  wildfly:
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    container_name: cargauy-wildfly
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cargauy
      DB_USER: cargauy
      DB_PASSWORD: cargauy123
      P1_ENTORNO_LOCAL: "true"
      PDI_ENDPOINT: http://mock-pdi:8080/pdi/ws
      BALANZA_ENDPOINT: http://mock-balanza:8080
      MONGO_URI: mongodb://mongodb:27017
    ports:
      - "8080:8080"
      - "9990:9990"

  mongodb:
    image: mongo:7
    container_name: cargauy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  mock-pdi:
    build:
      context: ./docker/mock-pdi
    container_name: cargauy-mock-pdi
    restart: unless-stopped
    environment:
      PDI_PUBLIC_ENDPOINT: http://mock-pdi:8080/pdi/ws
    ports:
      - "8081:8080"

  mock-balanza:
    build:
      context: ./docker/mock-balanza
    container_name: cargauy-mock-balanza
    restart: unless-stopped
    ports:
      - "8082:8080"

volumes:
  pgdata:
    driver: local
  mongodata:
    driver: local
