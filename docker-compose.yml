version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargauy
      POSTGRES_USER: cargauy
      POSTGRES_PASSWORD: cargauy123
      TZ: America/Montevideo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_p1:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargauy -d cargauy"]
      interval: 5s
      timeout: 5s
      retries: 5

  ldap:
    build: ./docker/ldap
    restart: unless-stopped
    environment:
      LDAP_ROOT_PASSWORD: ${LDAP_ROOT_PASSWORD:-vQUP53jJO6NyQD9V8hXK7oFQ-NmPjD9VS1NLoC-INkE}
      LDAP_APP_PASSWORD: ${LDAP_APP_PASSWORD:-admin123}
      LDAP_APP_UID: ${LDAP_APP_UID:-martin.admin}
    ports:
      - "127.0.0.1:1389:1389"
    volumes:
      - ldap_p1:/data

  mongodb:
    image: mongo:7
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_p1:/data/db

  mock-pdi:
    build: ./docker/mock-pdi
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PDI_PUBLIC_ENDPOINT: http://mock-pdi:8080/pdi/ws
      PDI_DELAY_SECONDS: "0"
      PDI_PERFILES_POSTGRES: "true"
      PGHOST: postgres
      PGDATABASE: cargauy
      PGUSER: cargauy
      PGPASSWORD: cargauy123
    ports:
      - "8081:8080"

  wildfly:
    env_file:
      - .env
      - ./.local-p1/gub-real.env
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    depends_on:
      - postgres
      - mongodb
      - ldap
      - mock-pdi



    environment:
      TZ: America/Montevideo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cargauy
      DB_USER: cargauy
      DB_PASSWORD: cargauy123
      P1_ENTORNO_LOCAL: "true"
      P1_BOOTSTRAP: "true"
      BOOTSTRAP_ADMIN_UID: "martin.admin"
      BOOTSTRAP_ADMIN_CI: "90000001"
      BOOTSTRAP_ADMIN_NOMBRE: "Administrador de pruebas"
      BOOTSTRAP_ADMIN_MAIL: "admin@example.invalid"
      BOOTSTRAP_ADMIN_NACIMIENTO: "1990-01-01"
      PDI_ENDPOINT: http://mock-pdi:8080/pdi/ws
      BALANZA_ENDPOINT: ${BALANZA_ENDPOINT:-https://cargauy-mock-balanza-latest.onrender.com}
      BALANZA_TIMEOUT_SECONDS: ${BALANZA_TIMEOUT_SECONDS:-15}
      TRACKING_ENDPOINT: ${TRACKING_ENDPOINT:-https://cargauy-mock-tracking-latest.onrender.com}
      TRACKING_TIMEOUT_SECONDS: ${TRACKING_TIMEOUT_SECONDS:-15}
      MONGO_URI: mongodb://mongodb:27017
      LDAP_URL: ldap://ldap:1389
      LDAP_ROOT_PASSWORD: ${LDAP_ROOT_PASSWORD:-vQUP53jJO6NyQD9V8hXK7oFQ-NmPjD9VS1NLoC-INkE}
      FAAS_TRACKING_URL: ${FAAS_TRACKING_URL:-}
      FAAS_SHARED_SECRET: ${FAAS_SHARED_SECRET:-}
      GUB_PROVEEDOR: iduruguay
      GUB_ISSUER: https://auth-testing.iduruguay.gub.uy/oidc/v1
      GUB_JWKS: https://auth-testing.iduruguay.gub.uy/oidc/v2/jwks
      GUB_CLIENT_ID: "890192"
      GUB_REDIRECT: ${GUB_REDIRECT:-https://carga-uy.web.elasticloud.uy/CargaUY-web/gub/callback}
      GUB_LOGOUT_REDIRECT: ${GUB_LOGOUT_REDIRECT:-https://carga-uy.web.elasticloud.uy/CargaUY-web/portal/inicio.xhtml}
      GUB_PKCE: "false"
      GUB_MOBILE_ENABLED: "true"
      GUB_MOBILE_REDIRECT: ${GUB_MOBILE_REDIRECT:-}
      GUB_DOCUMENT_PAIS: Uruguay
      GUB_DOCUMENT_TIPO: DNI
      GUB_DOCUMENT_ASUMIR_LOCAL: "true"
    ports:
      - "8080:8080"
      - "127.0.0.1:9990:9990"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /CargaUY-web/api/public/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  seed:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      - postgres
      - wildfly
    environment:
      PGPASSWORD: ${DB_PASSWORD:-cargauy123}
      TZ: America/Montevideo
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - psql
      - -h
      - postgres
      - -U
      - cargauy
      - -d
      - cargauy
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /scripts/seed-datos-prueba.sql

  reset-mongo:
    image: mongo:7
    restart: "no"
    depends_on:
      - mongodb
    environment:
      MONGO_DB: ${MONGO_DB:-cargauy_tracking}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-eventos_posicion}
    entrypoint:
      - mongosh
      - mongodb://mongodb:27017/${MONGO_DB:-cargauy_tracking}
      - --quiet
      - --eval
      - |
        const colName = process.env.MONGO_COLLECTION || 'eventos_posicion';
        const res = db.getCollection(colName).deleteMany({});
        db.getCollectionNames().forEach(name => {
          if (!name.startsWith('system.') && name !== colName) {
            db.getCollection(name).deleteMany({});
          }
        });
        const legacyDb = db.getSiblingDB('cargauy');
        if (legacyDb.getCollectionNames().includes('posiciones')) {
          legacyDb.posiciones.deleteMany({});
        }
        print('MongoDB reset (' + db.getName() + '.' + colName + '): deleted=' + res.deletedCount + ', remaining=' + db.getCollection(colName).countDocuments());

  reset:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      - postgres
      - reset-mongo
    environment:
      PGHOST: postgres
      PGUSER: cargauy
      PGDATABASE: cargauy
      PGPASSWORD: ${DB_PASSWORD:-cargauy123}
      TRACKING_ENDPOINT: ${TRACKING_ENDPOINT:-https://cargauy-mock-tracking-latest.onrender.com}
      TZ: America/Montevideo
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - /scripts/docker-reset.sh

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/lib/jelastic/keys:/etc/nginx/certs:ro
    depends_on:
      - wildfly

volumes:
  pgdata_p1:
  ldap_p1:
  mongo_p1:
